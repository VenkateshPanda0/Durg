[workspace]
resolver = "2"
members = ["kernel", "xtask", "crates/acpi", "crates/paging", "crates/pmm", "crates/heap", "crates/sync", "crates/syscall", "crates/elf", "crates/cap", "crates/virtio", "user"]
# The fuzz crate is its own workspace and needs a nightly toolchain (ADR-0008).
exclude = ["fuzz"]
# `cargo build` at the root builds only the host-side build tool. The kernel
# targets bare metal and is built through `cargo xtask build`.
default-members = ["xtask", "crates/acpi", "crates/paging", "crates/pmm", "crates/heap", "crates/sync", "crates/syscall", "crates/elf", "crates/cap", "crates/virtio"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/VenkateshPanda0/Durg"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
