[workspace]
resolver = "2"
members = ["kernel", "xtask", "crates/acpi", "crates/paging"]
# `cargo build` at the root builds only the host-side build tool. The kernel
# targets bare metal and is built through `cargo xtask build`.
default-members = ["xtask", "crates/acpi", "crates/paging"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
