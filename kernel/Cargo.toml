[package]
name = "durg-kernel"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "The Durg capability microkernel"
publish = false

[[bin]]
name = "durg-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Run the in-kernel self-tests after boot (used by `cargo xtask test`).
selftest = []
# Add a test that always fails, to prove the harness can fail.
fail-demo = ["selftest"]
