[package]
name = "durg-kernel"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "The Durg capability microkernel"
publish = false

[[bin]]
name = "durg-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
durg-acpi = { path = "../crates/acpi" }
durg-heap = { path = "../crates/heap" }
durg-paging = { path = "../crates/paging" }
durg-pmm = { path = "../crates/pmm" }
durg-sync = { path = "../crates/sync" }
durg-syscall = { path = "../crates/syscall" }

[features]
# Run the in-kernel self-tests after boot (used by `cargo xtask test`).
selftest = []
# Add a test that always fails, to prove the harness can fail.
fail-demo = ["selftest"]
# Trigger a double fault on purpose instead of running the normal flow.
df-test = []
# Overflow the kernel stack on purpose: the guard page must turn it into a
# double fault handled on its own stack.
so-test = []
# Run the heap out of memory on purpose: an infallible allocation that cannot
# be served must end in the allocation-failure panic.
oom-test = []
