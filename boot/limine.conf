# Limine boot configuration (Limine v9 format).
timeout: 0
serial: yes
verbose: no

/Durg
    protocol: limine
    path: boot():/boot/durg-kernel

    # The user programs, loaded into memory by the bootloader. The kernel finds
    # them by file name. `cargo xtask` builds them and puts them in /boot/user.
    module_path: boot():/boot/user/init.elf
    module_path: boot():/boot/user/task_a.elf
    module_path: boot():/boot/user/task_b.elf
    module_path: boot():/boot/user/dirty.elf
    module_path: boot():/boot/user/probe.elf
