name: Security issue (do not file here)
description: Suspected vulnerabilities are reported privately, not as issues
body:
  - type: markdown
    attributes:
      value: |
        **Please do not report a vulnerability in a public issue.** Use
        [private vulnerability reporting](https://github.com/VenkateshPanda0/Durg/security/advisories/new)
        and read [SECURITY.md](https://github.com/VenkateshPanda0/Durg/blob/main/SECURITY.md).
        This form exists only to point you there.
  - type: checkboxes
    id: understood
    attributes:
      label: Confirm
      options:
        - label: I have read this and will use private vulnerability reporting instead.
          required: true
