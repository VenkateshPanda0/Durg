name: KVM diagnosis (temporary)

# Temporary: finds out why the debug selftest variant faults under KVM on hosted
# runners. Runs only when this file changes. Remove once the cause is understood.
on:
  push:
    paths: [".github/workflows/kvm-diagnose.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    name: debug boot test under KVM, -cpu ${{ matrix.cpu }} (${{ matrix.n }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cpu: [host, generic]
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso ovmf binutils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm; grep -m1 'model name' /proc/cpuinfo; nproc
      - name: Use a generic CPU model under KVM (experiment)
        if: matrix.cpu == 'generic'
        run: |
          grep -n '"-cpu", "host"' xtask/src/main.rs
          sed -i 's|"-enable-kvm", "-cpu", "host"|"-enable-kvm", "-cpu", "qemu64,+smep,+smap,+umip"|' xtask/src/main.rs
          grep -n 'qemu64' xtask/src/main.rs
      - name: Debug boot test, four times
        continue-on-error: true
        run: |
          git rev-parse HEAD
          for i in 1 2 3 4; do
            if cargo xtask test > "boot-$i.log" 2>&1; then echo "run $i: PASS"; else echo "run $i: FAIL"; fi
          done
      - name: Show and symbolize the fatal fault
        continue-on-error: true
        run: |
          # The exact kernel that was booted: xtask keeps each variant's staging directory.
          K=target/iso_root-selftest/boot/durg-kernel
          ls -l "$K"; sha256sum "$K"
          grep -m1 'model name' /proc/cpuinfo
          for i in 1 2 3 4; do
            echo "=== run $i"
            # the fatal exception is the one followed by the QEMU exit line
            tac "boot-$i.log" | awk '/^QEMU exit status/ {f=1} f {print} /EXCEPTION: General Protection|EXCEPTION: Page Fault|EXCEPTION: Double Fault|PANIC/ && f {exit}' | tac | cut -c1-200 | tail -14
            rip=$(tac "boot-$i.log" | awk '/^QEMU exit status/ {f=1} f && /rip: 0x/ {print; exit}' | grep -o 'rip: 0x[0-9a-f]*' | sed 's/rip: //') || true
            if [ -n "$rip" ]; then
              echo "fatal rip=$rip"
              addr2line -e "$K" -f -i "$rip" | head -8
              nm -n "$K" | awk -v r="${rip#0x}" 'tolower($1) <= r' | tail -2
              objdump -d --no-show-raw-insn -M intel --start-address=$((rip - 64)) --stop-address=$((rip + 24)) "$K" | tail -26
            fi
          done
