name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep CI small: one target, headless QEMU with a timeout, cached builds.
jobs:
  boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU, xorriso and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso ovmf

      # rust-toolchain.toml pins the channel, target and components.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (kernel, default features)
        run: cargo clippy --package durg-kernel --target x86_64-unknown-none -- -D warnings

      - name: Clippy (kernel, selftest)
        run: cargo clippy --package durg-kernel --target x86_64-unknown-none --features selftest -- -D warnings

      - name: Clippy (kernel, fail-demo)
        run: cargo clippy --package durg-kernel --target x86_64-unknown-none --features fail-demo -- -D warnings

      - name: Clippy (kernel, df-test)
        run: cargo clippy --package durg-kernel --target x86_64-unknown-none --features df-test -- -D warnings

      - name: Clippy (kernel, so-test)
        run: cargo clippy --package durg-kernel --target x86_64-unknown-none --features so-test -- -D warnings

      - name: Clippy (kernel, oom-test)
        run: cargo clippy --package durg-kernel --target x86_64-unknown-none --features oom-test -- -D warnings

      - name: Clippy (xtask and pure crates)
        run: cargo clippy --package durg-xtask --package durg-acpi --package durg-paging --package durg-pmm --package durg-heap --all-targets -- -D warnings

      # Pure parsing logic runs on the host, not in QEMU.
      - name: Unit and property tests (pure crates, host)
        run: cargo test --package durg-acpi --package durg-paging --package durg-pmm --package durg-heap

      # Boots six kernel variants headless (plain, self-tests, a deliberate double
      # fault and a deliberate kernel stack overflow that must both be handled on
      # their own stack, a deliberate heap exhaustion that must end in the
      # allocation-failure panic, and a deliberate failure that must be reported
      # as one) and checks serial output and exit codes.
      # KVM is usually unavailable on hosted runners, so QEMU falls back to TCG.
      - name: Boot test
        run: cargo xtask test
