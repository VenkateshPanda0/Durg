name: CodeQL

# Static analysis of the Rust source. `build-mode: none` reads the source without
# compiling it, so the bare-metal target does not matter to the analysis. Unverified
# until its first hosted run has been read; see docs/REPO_SETTINGS.md and
# docs/repository-checklist.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:rust"
